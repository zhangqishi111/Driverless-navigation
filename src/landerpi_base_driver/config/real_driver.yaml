cmd_vel_adapter:
  ros__parameters:
    # Nav2 velocity smoother output.  Do not use /cmd_vel here: the vendor
    # controller subscribes to /cmd_vel itself, which would bypass this adapter.
    input_topic: /cmd_vel_nav_output
    output_topic: /controller/cmd_vel

    # 厂家底盘低于约0.03 m/s时不能有效运动。
    # 建图和首次联调阶段限制为低速。
    max_linear_speed: 0.20
    max_angular_speed: 0.50

    # 上层超过0.5秒未发送命令时，主动发布零速度。
    command_timeout: 0.50
